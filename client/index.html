<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Школа 911 · ОГЭ по математике</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Load the umami tag only when the analytics endpoint is actually
      // configured. Unset, Vite leaves the literal «%VITE_ANALYTICS_ENDPOINT%»,
      // and the browser fired a 502 for «/%VITE_ANALYTICS_ENDPOINT%/umami» on
      // every page. Guard on the leftover percent sign.
      (function () {
        var endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        var website = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (endpoint.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = endpoint + "/umami";
        s.setAttribute("data-website-id", website);
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
